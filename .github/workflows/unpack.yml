name: Unpack ZIP
on:
  push:
    paths:
      - 'tik-dz-github.zip'
      - '.github/workflows/unpack.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o tik-dz-github.zip
          rm -f tik-dz-github.zip .github/workflows/build.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract TIK DZ project"
          git push
